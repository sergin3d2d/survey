<!DOCTYPE html>
<html
    style="--global-font: {{ global_font_size|default(1.0) }}; --question-font: {{ question_font_size|default(1.6) }}rem; --desc-font: {{ description_font_size|default(1.4) }}rem;">

<head>
    <title>Initial Conditions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html {
            font-size: calc(var(--global-font) * 10px) !important;
        }

        label,
        .sus-question-text,
        .question label {
            font-size: var(--question-font) !important;
        }

        p,
        .text-muted,
        .description {
            font-size: var(--desc-font) !important;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            /* flex-start, not center: the form is taller than the viewport on a tablet */
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px 60px;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 820px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            color: #444;
            margin: 0 0 8px;
        }

        .page-sub {
            color: #777;
            margin: 0;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .section {
            border: 0;
            margin: 0 0 15px;
            padding: 0;
        }

        .section+.section {
            border-top: 1px solid #e8e9ee;
            padding-top: 30px;
        }

        .section-title {
            font-size: 1.15rem !important;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: #8a8f9a;
            font-weight: 700;
            margin: 0 0 22px;
        }

        .form-group {
            border: 0;
            padding: 0;
            margin: 0 0 26px;
        }

        .form-group>label,
        .form-group>legend {
            font-size: var(--question-font) !important;
            font-weight: bold;
            display: block;
            padding: 0;
            margin-bottom: 12px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccd0d6;
            border-radius: 6px;
            font-size: var(--desc-font);
            font-family: inherit;
            color: inherit;
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Radio pills: input and text live inside one label so they wrap together */
        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .option {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 0 !important;
            padding: 11px 18px;
            border: 1px solid #d5d8dd;
            border-radius: 8px;
            background: #fff;
            font-size: var(--desc-font) !important;
            font-weight: normal !important;
            line-height: 1.25;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .option:hover {
            border-color: #9fb6d4;
            background: #f7faff;
        }

        .option:focus-within {
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }

        .option.is-selected,
        .option:has(input:checked) {
            border-color: #007bff;
            background: #eaf3ff;
            color: #0b4d9c;
            font-weight: 600 !important;
        }

        .option input[type="radio"] {
            width: 1.1rem;
            height: 1.1rem;
            margin: 0;
            flex: none;
            accent-color: #007bff;
        }

        .field-hint {
            font-size: 1.05rem !important;
            font-weight: normal;
            color: #8a8f9a;
            margin: 8px 0 0;
        }

        /* Follow-up questions revealed by an earlier answer */
        .conditional {
            border-left: 3px solid #cfe0f5;
            padding-left: 22px;
            margin-bottom: 26px;
        }

        .conditional .form-group:last-child {
            margin-bottom: 0;
        }

        .input-unit {
            position: relative;
        }

        .input-unit input {
            padding-right: 55px;
        }

        .input-unit .unit {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9096a1;
            font-size: var(--desc-font);
            pointer-events: none;
        }

        [hidden] {
            display: none !important;
        }

        .navigation-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
            padding-top: 25px;
            border-top: 1px solid #e8e9ee;
        }

        .btn {
            border: none;
            padding: 15px 40px;
            border-radius: 6px;
            cursor: pointer;
            font-size: var(--desc-font);
            font-family: inherit;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        @media (max-width: 640px) {
            body {
                padding: 0;
            }

            .container {
                padding: 25px 20px 30px;
                border-radius: 0;
            }

            .conditional {
                padding-left: 15px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="page-header">
            <h1>Initial Conditions</h1>
            <p class="page-sub">Recorded once per participant, before the first condition.</p>
        </header>

        <form action="/initialize_experiment" method="post">
            <fieldset class="section">
                <h2 class="section-title">Participant</h2>

                <div class="form-group">
                    <label for="participant_id">Participant ID</label>
                    <input type="number" id="participant_id" name="participant_id" min="1" step="1" required>
                    <p class="field-hint">Sets the counterbalanced condition order.</p>
                </div>

                <fieldset class="form-group">
                    <legend>Gender</legend>
                    <div class="option-group">
                        <label class="option">
                            <input type="radio" name="gender" value="female" required>
                            <span>Female</span>
                        </label>
                        <label class="option">
                            <input type="radio" name="gender" value="male">
                            <span>Male</span>
                        </label>
                        <label class="option">
                            <input type="radio" name="gender" value="non_binary">
                            <span>Non-binary</span>
                        </label>
                        <label class="option">
                            <input type="radio" name="gender" value="prefer_not_to_say">
                            <span>Prefer not to say</span>
                        </label>
                    </div>
                </fieldset>
            </fieldset>

            <fieldset class="section">
                <h2 class="section-title">Vision</h2>

                <fieldset class="form-group">
                    <legend>Do you wear glasses or contact lenses?</legend>
                    <div class="option-group">
                        <label class="option">
                            <input type="radio" id="vision_correction_none" name="vision_correction" value="none"
                                required>
                            <span>No</span>
                        </label>
                        <label class="option">
                            <input type="radio" name="vision_correction" value="glasses">
                            <span>Glasses</span>
                        </label>
                        <label class="option">
                            <input type="radio" name="vision_correction" value="contact_lenses">
                            <span>Contact lenses</span>
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="vision_test_score_uncorrected">Vision test score without correction</label>
                    <input type="number" id="vision_test_score_uncorrected" name="vision_test_score_uncorrected"
                        step="any" required>
                </div>

                <!-- Only relevant to participants who use correction; hidden and
                     disabled otherwise, so the values stay blank in the results -->
                <div class="conditional" id="correction_details" hidden>
                    <fieldset class="form-group">
                        <legend>Worn during the experiment?</legend>
                        <div class="option-group">
                            <label class="option">
                                <input type="radio" name="vision_correction_worn" value="yes" required>
                                <span>Yes</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="vision_correction_worn" value="no">
                                <span>No</span>
                            </label>
                        </div>
                    </fieldset>

                    <div class="form-group">
                        <label for="vision_test_score_corrected">Vision test score with correction</label>
                        <input type="number" id="vision_test_score_corrected" name="vision_test_score_corrected"
                            step="any" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="ipd">Interpupillary distance (IPD)</label>
                    <div class="input-unit">
                        <input type="number" id="ipd" name="ipd" step="any" min="0" required>
                        <span class="unit">mm</span>
                    </div>
                </div>
            </fieldset>

            <fieldset class="section">
                <h2 class="section-title">Handedness &amp; Experience</h2>

                <fieldset class="form-group">
                    <legend>Dominant hand</legend>
                    <div class="option-group">
                        <label class="option">
                            <input type="radio" name="dominant_hand" value="left" required>
                            <span>Left</span>
                        </label>
                        <label class="option">
                            <input type="radio" name="dominant_hand" value="right">
                            <span>Right</span>
                        </label>
                    </div>
                </fieldset>

                <fieldset class="form-group">
                    <legend>Previous AR experience</legend>
                    <div class="option-group">
                        <label class="option">
                            <input type="radio" name="previous_ar_experience" value="yes" required>
                            <span>Yes</span>
                        </label>
                        <label class="option">
                            <input type="radio" name="previous_ar_experience" value="no">
                            <span>No</span>
                        </label>
                    </div>
                </fieldset>
            </fieldset>

            <div class="navigation-buttons">
                <button type="submit" class="btn btn-primary">Next</button>
            </div>
        </form>
    </div>

    <script>
        (function () {
            var radios = Array.prototype.slice.call(document.querySelectorAll('.option input[type="radio"]'));

            // Fallback highlight for browsers without :has()
            function syncPills() {
                radios.forEach(function (radio) {
                    radio.parentNode.classList.toggle('is-selected', radio.checked);
                });
            }

            // The follow-up questions only apply to participants who use correction.
            // Disabling clears them from the submission and drops their `required`.
            var correctionDetails = document.getElementById('correction_details');
            var correctionChoices = document.querySelectorAll('input[name="vision_correction"]');

            function syncCorrection() {
                var chosen = null;
                correctionChoices.forEach(function (choice) {
                    if (choice.checked) {
                        chosen = choice.value;
                    }
                });
                var relevant = chosen !== null && chosen !== 'none';

                correctionDetails.hidden = !relevant;
                correctionDetails.querySelectorAll('input').forEach(function (input) {
                    input.disabled = !relevant;
                    if (!relevant) {
                        if (input.type === 'radio') {
                            input.checked = false;
                        } else {
                            input.value = '';
                        }
                    }
                });
            }

            radios.forEach(function (radio) {
                radio.addEventListener('change', function () {
                    syncCorrection();
                    syncPills();
                });
            });

            syncCorrection();
            syncPills();
        })();
    </script>
</body>

</html>
